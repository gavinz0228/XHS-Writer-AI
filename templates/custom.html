{% extends "base.html" %}
{% block title %}XHSWriter - 自定义话题{% endblock %}

{% block content %}
<div class="control-panel">
    <div class="input-group" style="flex: 2;">
        <label for="customTopic">输入自定义话题</label>
        <input type="text" id="customTopic" placeholder="例如：AI技术发展、王鹤棣新剧...">
    </div>

    <button id="generateCustomBtn" class="primary-btn">
        <span class="btn-text">生成笔记</span>
        <span class="loader"></span>
    </button>
</div>

<div id="results" class="results-grid">
    <!-- 结果卡片将在这里动态生成 -->
</div>
{% endblock %}
