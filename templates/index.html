<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XHSWriter - 爆款笔记生成器</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>XHSWriter</h1>
            <p>全自动小红书爆款内容生成引擎</p>
        </header>

        <main>
            <div class="control-panel">
                <div class="input-group">
                    <label for="platform">热点来源</label>
                    <select id="platform">
                        <option value="weibo">微博 (Weibo)</option>
                        <option value="baidu">百度 (Baidu)</option>
                        <option value="zhihu">知乎 (Zhihu)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="count">生成数量</label>
                    <input type="number" id="count" value="1" min="1" max="5">
                </div>

                <button id="generateBtn" class="primary-btn">
                    <span class="btn-text">开始生成</span>
                    <span class="loader"></span>
                </button>
            </div>

            <div id="results" class="results-grid">
                <!-- 结果卡片将在这里动态生成 -->
            </div>
        </main>

        <footer>
            <p>Powered by OpenAI & DeepSeek & md2card</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
